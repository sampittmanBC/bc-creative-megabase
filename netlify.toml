[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["web/index.html"]

[[headers]]
  for = "/api/directory"
  [headers.values]
    Cache-Control = "no-store"
